<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://pyscript.net https://cdn.jsdelivr.net;" charset="UTF-8">
    <title>Драконьи карты</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    <style>
        html {
            /* #2b1d14 — запасной цвет, если картинка не загрузится */
            background: url("./photo_2026-08-07_21-03-06.jpg") center / cover no-repeat fixed;
            min-height: 100%;
        }
        
        /* Контентная колонка */
        body {
            font-family: sans-serif;
            max-width: 860px;
            margin: 0 auto;           /* центрируем */
            padding: 2rem 1rem;       /* отступы вместо margin, чтобы работало на узких экранах */
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* Контраст заголовка над фото */
        h1 {
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }
        .hidden { display: none; }
        .panel { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; background: rgba(255, 255, 255, 0.57);}
        .match { margin: 0.5rem 0; padding: 0.5rem; background: rgba(255, 255, 255, 0.57); }
        .player-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .player-form input[type="text"]   { width: 8rem; }
        .player-form input[type="number"] { width: 4rem; }
        .player-remove { margin-left: 0.5rem; color: #c00; }

        .player-export, .leaderboard-export {
            margin-left: 0.5rem;
            color: rgb(86, 137, 246);
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.2rem;
        }
        .player-export:hover, .leaderboard-export:hover { opacity: 0.7; }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gear-btn {
            font-size: 1.4rem;
            background: rgba(255,255,255,0.85);
            border: 1px solid #ccc;
            border-radius: 50%;
            width: 2.8rem;
            height: 2.8rem;
            cursor: pointer;
        }
        .gear-btn:hover { background: #fff; }
        /* Шапка внутри панели (лидерборд) */
        .panel .header-bar h2 { margin: 0; }

        /* Подробные метрики под именем в лидерборде */
        .lb-details {
            font-size: 0.9em;
            color: #444;
            margin-top: 0.2rem;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem 2rem;
            max-width: 560px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-content h3 {
            margin-top: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.3rem;
        }
        .config-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0.4rem 0;
            flex-wrap: wrap;
        }
        .config-row input[type="number"] { width: 5rem; }
        .config-row input[type="text"]   { width: 14rem; }
        .dist-row {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
            align-items: center;
        }
        .dist-row label {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }
        .hint {
            font-size: 0.85rem;
            color: #666;
            margin: 0.3rem 0 0;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        input[type="file"].hidden { display: none; }

                /* Тост */
        #toast {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 1.4rem;
            border-radius: 6px;
            z-index: 3000;
            font-size: 1rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            max-width: 80vw;
            cursor: pointer;
            animation: toast-in 0.2s ease-out;
        }
        #toast.hidden { display: none; }
        .toast-error { background: #d32f2f; color: #fff; }
        .toast-warn  { background: #f57c00; color: #fff; }
        .toast-info  { background: #1976d2; color: #fff; }

        @keyframes toast-in {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Подсветка невалидных полей */
        .invalid {
            border-color: #d32f2f !important;
            box-shadow: 0 0 0 2px rgba(211, 47, 47, 0.35) !important;
            background: #fff5f5 !important;
            outline: none;
        }
    </style>
</head>
<body>
<div class="header-bar">
    <h1>Драконьи карты</h1>
    <button id="btn-open-config" class="gear-btn" title="Настройки">⚙</button>
</div>

<div id="toast" class="hidden"></div>

<!-- Панель создания игроков -->
<div id="panel-setup" class="panel">
    <h2>Создание игроков</h2>
    <div class="player-form">
        <input type="text"   id="inp-name"   placeholder="Имя" />
        <label>Кубы:     <input type="number" id="inp-dice"   value="1" min="1" /></label>
        <label>Модиф:      <input type="number" id="inp-modif"  value="0" /></label>
        <label>Рероллы:  <input type="number" id="inp-reroll" value="0" min="0" max="2"/></label>
        <label><input type="checkbox" id="inp-adv" />   Преимущ.</label>
        <label><input type="checkbox" id="inp-human" /> PC</label>
        <button id="btn-add-player">Добавить</button>
        <button id="btn-generate-npc">Случайный NPC</button>
        <button id="btn-import-player">Импорт</button>
        <input type="file" id="player-file-input"
            accept=".json,application/json" class="hidden" />
    </div>
    <ol id="player-list"></ol>
    <button id="btn-clear-players">Сбросить всех</button>
    <button id="btn-start-tournament" disabled>Начать турнир</button>
</div>

<div id="panel-pc-roll" class="panel hidden">
    <p id="pc-roll-prompt"></p>
    <input type="number" id="pc-roll-input" />
    <button id="btn-submit-roll">Подтвердить</button>
</div>

<div id="panel-reroll" class="panel hidden">
    <p id="reroll-prompt"></p>
    <button id="btn-reroll-yes">Перебросить</button>
    <button id="btn-reroll-no">Оставить</button>
</div>

<div id="panel-round-done" class="panel hidden">
    <p id="round-done-prompt"></p>
    <button id="btn-next-round">Следующий раунд</button>
</div>

<div class="panel">
    <div class="header-bar">
        <h2>Лидерборд</h2>
        <button id="btn-lb-details" disabled>Подробно</button>
    </div>
    <ol id="leaderboard"></ol>
</div>

<div class="panel">
    <h2>История</h2>
    <div id="history"></div>
</div>

<div id="config-modal" class="modal hidden">
    <div class="modal-content">
        <h2>Настройки</h2>

        <h3>Генератор</h3>
        <div class="config-row">
            <label>Кубы:</label>
            <input type="number" id="cfg-dice-min" value="1" min="1" />
            <span>—</span>
            <input type="number" id="cfg-dice-max" value="3" min="1" />
        </div>
        <div class="config-row">
            <label>Модификатор:</label>
            <input type="number" id="cfg-modif-min" value="-1" />
            <span>—</span>
            <input type="number" id="cfg-modif-max" value="2" />
        </div>
        <div class="config-row">
            <label>Рероллы:</label>
            <input type="number" id="cfg-reroll-min" value="0" min="0" max="2" />
            <span>—</span>
            <input type="number" id="cfg-reroll-max" value="2" min="0" max="2" />
        </div>
        <div class="config-row">
            <label>Шанс преимущества (%):</label>
            <input type="number" id="cfg-adv-chance" value="30" min="0" max="100" />
        </div>
        <div class="dist-row">
            <label><input type="radio" name="cfg-dist" id="cfg-dist-uniform" value="uniform" checked /> Равномерное</label>
            <label><input type="radio" name="cfg-dist" id="cfg-dist-normal"  value="logit_normal" /> Логит-нормальное</label>
        </div>

        <h3>Файл конфигурации</h3>
        <div class="config-row">
            <label>Имя файла:</label>
            <input type="text" id="cfg-filename" value="dragon_config.json" />
        </div>
        <div class="config-row">
            <button id="btn-config-load">Загрузить из файла…</button>
            <input type="file" id="cfg-file-input" accept=".json,application/json" class="hidden" />
        </div>
        <div class="modal-actions">
            <button id="btn-config-cancel">Отмена</button>
            <button id="btn-config-save">Сохранить и скачать</button>
        </div>
    </div>
</div>

<script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
