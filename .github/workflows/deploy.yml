name: Deploy with Cache Busting

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache-busting version
        run: |
          VERSION=$(git rev-parse --short HEAD)
          echo "Using version: $VERSION"
          # Обрабатываем index.html
          find . -name "*.html" -exec sed -i "s/__VERSION__/$VERSION/g" {} \;
          # Обрабатываем конфигурационные файлы PyScript
          find . -name "pyscript.toml" -o -name "pyscript.json" | while read file; do
            sed -i "s/__VERSION__/$VERSION/g" "$file"
          done
          # (Опционально) Обрабатываем другие .toml файлы, если они есть
          find . -name "*.toml" ! -path "./.github/*" -exec sed -i "s/__VERSION__/$VERSION/g" {} \;

      # 1. Загружаем папку с сайтом как артефакт
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . # или ваша папка _site

      # 2. Деплоим артефакт на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4